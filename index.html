<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WOWHAUS — Project Intelligence Demo v3</title>
<style>
:root{
  --bg:#f8f7f4;
  --panel:#ffffff;
  --line:#e7e4de;
  --line2:#f0ede8;
  --text:#20211f;
  --muted:#8a8780;
  --orange:#e96b24;
  --orange2:#f08a4a;
  --orange-soft:#fff1e7;
  --peach:#f8d8c3;
  --peach2:#fde8da;
  --green:#2d9b66;
  --green-soft:#eaf7ef;
  --red:#d8554e;
  --red-soft:#fff0ef;
  --blue:#5c9ad2;
  --blue-soft:#eaf3fb;
  --purple:#8b73d7;
  --shadow:0 1px 2px rgba(25,25,25,.03),0 2px 10px rgba(25,25,25,.015);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
  width:210px;background:#fff;border-right:1px solid var(--line);
  position:fixed;left:0;top:0;bottom:0;padding:14px 10px;z-index:20
}
.logo{
  width:36px;height:36px;border-radius:7px;background:linear-gradient(180deg,#cf5313,#ea6b24);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;margin:0 0 14px 4px
}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  width:100%;border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:7px;
  color:#54514d;font-size:13px
}
.nav button:hover{background:#f7f5f1}
.nav button.active{background:#fff0e7;color:#d95d17}
.nav-title{font-size:10px;color:#aaa69e;text-transform:uppercase;margin:18px 11px 6px;letter-spacing:.04em}
.side-bottom{position:absolute;left:10px;right:10px;bottom:14px}
.main{margin-left:210px;width:calc(100% - 210px);padding:20px 28px 36px}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}
.eyebrow{font-size:10px;text-transform:uppercase;color:#9f9b94;letter-spacing:.07em}
.h1{font-size:30px;font-weight:700;line-height:1.1;margin:5px 0 6px}
.sub{font-size:13px;color:var(--muted);line-height:1.4;max-width:900px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:7px;font-size:12px;color:#333}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:hover{filter:brightness(.985)}
.select{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:7px;font-size:12px;color:#555}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:15px 16px;position:relative;min-height:118px}
.kpi .label{font-size:13px;font-weight:600}
.kpi .value{font-size:29px;font-weight:700;margin-top:14px}
.kpi .meta{font-size:11px;color:var(--muted);margin-top:5px}
.kpi-icon{
  position:absolute;right:14px;top:14px;width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;font-size:20px;font-weight:700
}
.ic-orange{background:#fff0e7;color:var(--orange)} .ic-green{background:#e9f7ef;color:var(--green)}
.ic-blue{background:#e9f3fc;color:var(--blue)} .ic-purple{background:#f0ecfb;color:var(--purple)}
.ic-red{background:#fff0ef;color:var(--red)}
.up{color:var(--green)} .down{color:var(--red)}
.panel{padding:15px}
.panel h3{font-size:15px;margin:0 0 12px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.small{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.cols2{display:grid;grid-template-columns:1.08fr .92fr;gap:14px;margin-bottom:14px}
.cols2equal{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:var(--orange-soft);color:#c95d1f;font-size:11px}
.pill.green{background:var(--green-soft);color:#2c7c55}.pill.red{background:var(--red-soft);color:#bd4943}.pill.blue{background:var(--blue-soft);color:#3d709e}
.progress{height:7px;border-radius:99px;background:#eeeae4;overflow:hidden}.progress span{display:block;height:100%;background:var(--orange)}
.tabs{display:flex;gap:14px;border-bottom:1px solid var(--line2)}.tab{border:0;background:transparent;padding:9px 2px;font-size:12px;color:#777;border-bottom:2px solid transparent}.tab.active{color:var(--orange);border-color:var(--orange)}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th{font-size:10px;color:#8c8982;text-align:left;font-weight:600;padding:9px;border-bottom:1px solid var(--line)}
.table td{padding:11px 9px;border-bottom:1px solid var(--line2);font-size:12px;vertical-align:middle}
.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#fff9f5}
.project-name{display:flex;align-items:center;gap:10px}.project-thumb{width:84px;height:46px;border-radius:6px;background:linear-gradient(135deg,#c8d8df,#f5f0e6 50%,#94a78f);position:relative;overflow:hidden;flex:0 0 auto}
.project-thumb:before{content:"";position:absolute;width:70%;height:40%;left:15%;bottom:18%;background:#fff;opacity:.82;transform:skewX(-7deg)}
.avatar{width:30px;height:30px;border-radius:50%;background:#f0eee9;display:grid;place-items:center;font-size:11px}
.search{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:7px;font-size:12px;min-width:260px}
.funnel{
  display:grid;grid-template-columns:1.1fr 1fr .95fr .8fr;overflow:hidden;border-radius:7px
}
.funnel .step{padding:22px 12px;text-align:center;background:#ffd8bd;position:relative}
.funnel .step:nth-child(2){background:#fac29a}.funnel .step:nth-child(3){background:#f49a5d}.funnel .step:nth-child(4){background:var(--orange);color:#fff}
.funnel .step b{display:block;font-size:20px;margin-top:5px}
.funnel-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.funnel-stats div{background:#f7f5f1;border-radius:6px;padding:7px;text-align:center;font-size:12px}
.chart{height:190px;position:relative;border-left:1px solid #eeeae4;border-bottom:1px solid #eeeae4;padding:0 10px 0 6px}
.chart-bars{height:100%;display:flex;align-items:flex-end;gap:10px}
.chart .bar{flex:1;background:#f2d6c2;position:relative;min-width:10px}.chart .bar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:#ed7c3e}
.months{display:flex;justify-content:space-between;font-size:9px;color:#8a877f;margin-top:5px}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px}
.project-list{display:flex;flex-direction:column;gap:8px}
.project-item{padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.project-item:hover{background:#fff9f4}.project-item.active{background:#fff3eb;border-color:#efc3a7}
.project-item b{display:block;margin-bottom:3px;font-size:13px}
.finance-main{display:grid;grid-template-columns:1.35fr .9fr;gap:14px}
.cash-chart{height:168px;position:relative;border-left:1px solid #eeeae4;border-bottom:1px solid #eeeae4;margin-top:8px}
.cash-bars{display:flex;align-items:center;gap:6px;height:100%}.cash-pair{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;height:100%}.cash-pair span{width:42%;align-self:flex-end}.cash-pair span.in{background:#f2b088}.cash-pair span.out{background:#f3dfd1}
.line{
  position:absolute;left:1%;right:1%;bottom:43%;height:2px;background:var(--orange);transform:rotate(-4deg);transform-origin:left center
}
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric-box{padding:15px}.metric-box .big{font-size:24px;font-weight:700;margin-top:9px}
.gantt{overflow:auto}.gantt-grid{min-width:1200px}.gantt-head,.gantt-row{display:grid;grid-template-columns:280px 1fr;border-bottom:1px solid var(--line2)}.gantt-head{font-size:10px;color:#888}.gantt-row{min-height:86px}.gantt-name{padding:13px}.timeline{position:relative;background:repeating-linear-gradient(to right,#fff 0,#fff calc(8.333% - 1px),#f0ede8 calc(8.333% - 1px),#f0ede8 8.333%)}.task{position:absolute;height:25px;top:31px;border-radius:5px;padding:6px 7px;font-size:10px;white-space:nowrap;overflow:hidden}.t1{background:#f5c5a4}.t2{background:#f5e0c8}.t3{background:#cfe0ef}.t4{background:#c7e7d4}.today{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);left:67%}.today:before{content:"Сегодня";position:absolute;top:4px;left:4px;background:var(--orange);color:#fff;padding:3px 5px;border-radius:4px;font-size:9px}
.project-header{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:14px;margin-bottom:14px}.hero-thumb{height:150px;border-radius:8px;background:linear-gradient(135deg,#c4d5dd,#f6efe2 53%,#8ea28d);position:relative;overflow:hidden}.hero-thumb:before,.hero-thumb:after{content:"";position:absolute;background:#fff;opacity:.82}.hero-thumb:before{width:72%;height:42%;left:14%;bottom:17%;transform:skewX(-8deg)}.hero-thumb:after{width:50%;height:9%;left:25%;bottom:43%}
.header-fields{display:grid;grid-template-columns:1.2fr .8fr .8fr 1fr;gap:16px;margin-top:18px}.header-field .label{font-size:10px;color:var(--muted);margin-bottom:5px}.header-field b{font-size:12px}
.stageflow{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.stageflow div{padding:18px 10px;text-align:center;background:#f8dfcc;font-size:12px}.stageflow .active{background:var(--orange);color:#fff}
.risk{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px}
.feed-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px}.feed-icon{width:28px;height:28px;border-radius:50%;background:#f5f2ed;display:grid;place-items:center;flex:0 0 auto}
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);align-items:center;justify-content:center;z-index:100}.modal{width:480px;max-height:88vh;overflow:auto;background:#fff;border-radius:12px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:8px 0}.field label{display:block;font-size:11px;color:#77736d;margin-bottom:5px}.field input,.field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.toast{position:fixed;right:24px;bottom:24px;background:#222;color:#fff;padding:11px 14px;border-radius:8px;display:none;z-index:120;font-size:12px}
.notice{padding:10px 12px;border:1px solid #f3d5c1;background:#fff8f2;border-radius:8px;color:#805a3d;font-size:12px;margin-bottom:14px}
.hero-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.hero-choice{padding:17px;cursor:pointer}.hero-choice:hover{background:#fff9f5}.hero-choice b{display:block;margin-bottom:5px}
@media(max-width:1200px){.sidebar{width:175px}.main{margin-left:175px;width:calc(100% - 175px)}.grid4,.grid6{grid-template-columns:repeat(2,1fr)}.cols2,.cols2equal,.split,.finance-main{grid-template-columns:1fr}.hero-choices{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">WH</div>
  <div class="nav">
    <button data-view="home">⌂ Главная</button>
    <button data-view="projects">□ Проекты</button>
    <button data-view="sales">▥ Продажи</button>
    <button data-view="finance">▤ Финансы</button>
    <button data-view="schedule">▦ Графики проектов</button>
    <button data-view="load">◌ Загрузка</button>
    <button data-view="project">▣ Дашборд проекта</button>
  </div>
  <div class="nav-title">Служебное</div>
  <div class="nav">
    <button onclick="showToast('В реальной системе здесь роли и права доступа')">⚙ Настройки</button>
  </div>
  <div class="side-bottom"><button class="btn" style="width:100%" onclick="resetDemo()">↻ Сбросить демо</button></div>
</aside>
<main class="main" id="view"></main>
</div>
<div class="modal-back" id="modalBack"><div class="modal">
  <div class="section-title"><h3 id="modalTitle" style="margin:0">Редактирование</h3><button class="btn" onclick="closeModal()">×</button></div>
  <div id="modalBody"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const defaultState={
 currentProject:3,
 projects:[
  {id:1,name:'Лотошино Resort',type:'Гостинично-рекреационный комплекс',place:'Московская область',client:'ООО «Лотошино Девелопмент»',stage:'Переговоры',budget:120,prob:70,pm:'Иван Крылов',role:'Партнёр',finish:'30.09.2025',status:'В работе',hoursPlan:9800,hoursFact:6100,ready:58,startShift:0,team:9,rate:.0045},
  {id:2,name:'Банный комплекс',type:'Культурно-оздоровительный комплекс',place:'Калужская область',client:'Частный инвестор',stage:'Компред',budget:85,prob:50,pm:'Анна Сергеева',role:'Руководитель проектов',finish:'15.11.2025',status:'Риск',hoursPlan:7200,hoursFact:5000,ready:64,startShift:2,team:7,rate:.0048},
  {id:3,name:'Центр художественной гимнастики',type:'Спортивный комплекс',place:'г. Казань',client:'ГБУ «Спортразвитие»',stage:'В работе',budget:227.5,prob:100,pm:'Дмитрий Никитин',role:'Коммерческий директор',finish:'20.12.2025',status:'В работе',hoursPlan:12800,hoursFact:9240,ready:68,startShift:0,team:12,rate:.0046}
 ],
 assumptions:{subcontract:25,travel:5,overhead:18,reserve:5}
};
let state=loadState();
function clone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){try{let s=localStorage.getItem('wowhausDemoV3');return s?JSON.parse(s):clone(defaultState)}catch(e){return clone(defaultState)}}
function saveState(){localStorage.setItem('wowhausDemoV3',JSON.stringify(state))}
function resetDemo(){localStorage.removeItem('wowhausDemoV3');state=clone(defaultState);setView('home');showToast('Демо сброшено')}
function current(){return state.projects.find(p=>p.id===state.currentProject)}
function project(id){return state.projects.find(p=>p.id===id)}
function money(x){return Number(x).toLocaleString('ru-RU',{maximumFractionDigits:1})}
function totalPipeline(){return state.projects.reduce((s,p)=>s+p.budget,0)}
function weighted(){return state.projects.reduce((s,p)=>s+p.budget*p.prob/100,0)}
function pageHeader(title,sub,actions=''){return `<div class="topbar"><div><div class="eyebrow">WOWHAUS · PROJECT INTELLIGENCE DEMO</div><div class="h1">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function kpi(label,value,meta,icon,cls='ic-orange'){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="meta">${meta}</div><div class="kpi-icon ${cls}">${icon}</div></div>`}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1700)}
function openModal(){document.getElementById('modalBack').style.display='flex'} function closeModal(){document.getElementById('modalBack').style.display='none'}
function financeMetrics(p){
 const labor=p.hoursPlan*p.rate;
 const forecastCost=Math.min(p.budget*.95,labor+state.assumptions.subcontract+state.assumptions.travel+state.assumptions.overhead+state.assumptions.reserve);
 const margin=Math.max(0,p.budget-forecastCost);
 return {labor,forecastCost,margin,marginPct:p.budget?margin/p.budget*100:0}
}
function thumb(){return `<div class="project-thumb"></div>`}
function renderHome(){
 document.getElementById('view').innerHTML=pageHeader('Управленческая платформа бюро','Демо-сценарий объединяет продажи, экономику, графики и проектную аналитику.')
 +`<div class="notice">Измените вероятность сделки, плановые часы или сдвиг графика — показатели в связанных модулях пересчитаются автоматически.</div>
 <div class="hero-choices">
 <div class="card hero-choice" onclick="setView('sales')"><b>Продажи</b><span class="small">Воронка, прогноз и лиды из Pyrus.</span></div>
 <div class="card hero-choice" onclick="setView('finance')"><b>Финансовые модели</b><span class="small">План / факт / прогноз и маржа.</span></div>
 <div class="card hero-choice" onclick="setView('schedule')"><b>Графики проектов</b><span class="small">Этапы, сроки, вехи и риски.</span></div>
 <div class="card hero-choice" onclick="setView('project')"><b>Дашборд проекта</b><span class="small">Единый паспорт проекта.</span></div></div>`;
}
function renderProjects(){
 document.getElementById('view').innerHTML=pageHeader('Проекты','Список проектов бюро и быстрый переход в карточку.')
 +`<div class="card panel"><table class="table"><thead><tr><th>Проект</th><th>Клиент</th><th>Статус</th><th>Стадия</th><th>Бюджет</th><th>Руководитель</th></tr></thead><tbody>${state.projects.map(p=>`<tr class="clickable" onclick="openProject(${p.id})"><td><div class="project-name">${thumb()}<div><b>${p.name}</b><div class="small">${p.type}<br>${p.place}</div></div></div></td><td>${p.client}</td><td><span class="pill ${p.status==='Риск'?'red':''}">${p.status}</span></td><td>${p.stage}</td><td>${money(p.budget)} млн ₽</td><td>${p.pm}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderSales(){
 const avg=Math.round(state.projects.reduce((s,p)=>s+p.prob,0)/state.projects.length);
 const rows=state.projects.map(p=>`<tr class="clickable" onclick="openProject(${p.id})"><td><div class="project-name">${thumb()}<div><b>${p.name}</b><div class="small">${p.type}<br>${p.place}</div></div></div></td><td>${p.client}</td><td><span class="pill">${p.stage}</span></td><td>${money(p.budget)}</td><td><div style="display:flex;align-items:center;gap:7px"><b>${p.prob}%</b><button class="btn" style="padding:4px 6px" onclick="event.stopPropagation();editProbability(${p.id})">изменить</button></div><div class="progress" style="width:110px;margin-top:5px"><span style="width:${p.prob}%"></span></div></td><td><div style="display:flex;align-items:center;gap:8px"><div class="avatar">${p.pm.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div>${p.pm}<div class="small">${p.role}</div></div></div></td><td>${p.finish}</td></tr>`).join('');
 document.getElementById('view').innerHTML=pageHeader('Дашборд продаж','Аналитика по продажам, воронка проектов, прогноз выручки и ключевые показатели.',`<select class="select"><option>Текущий год — 2025</option></select><button class="btn primary" onclick="openLeadModal()">+ Добавить лид</button><button class="btn">Экспорт</button><button class="btn">Поделиться</button>`)
 +`<div class="grid4">
 ${kpi('Воронка, млн ₽',money(totalPipeline()),'Сумма на всех стадиях','▥','ic-orange')}
 ${kpi('Weighted pipeline, млн ₽',money(weighted()),'С учётом вероятности','🏆','ic-green')}
 ${kpi('Средняя вероятность',avg+'%','По активным лидам','●','ic-blue')}
 ${kpi('Средний чек, млн ₽',money(totalPipeline()/state.projects.length),'По 3 проектам','▤','ic-purple')}
 </div>
 <div class="cols2">
  <div class="card panel"><h3>Воронка продаж, млн ₽</h3><div class="funnel"><div class="step">Лид<b>${money(totalPipeline())}</b></div><div class="step">Переговоры<b>${money(totalPipeline()*.64)}</b></div><div class="step">Компред<b>${money(totalPipeline()*.36)}</b></div><div class="step">Weighted<b>${money(weighted())}</b></div></div><div class="funnel-stats"><div>100%</div><div>64%</div><div>36%</div><div>${Math.round(weighted()/totalPipeline()*100)}%</div></div></div>
  <div class="card panel"><div class="section-title"><h3>Ожидаемая выручка по месяцам, млн ₽</h3><div class="small">● Базовый сценарий &nbsp; ● Потенциально</div></div><div class="chart"><div class="chart-bars">${[14,20,31,39,46,53,60,68,76,85,94,100].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><div class="months">${['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'].map(m=>`<span>${m}</span>`).join('')}</div></div>
 </div>

function editProject(){let p=current();document.getElementById('modalTitle').textContent='Обновить проект';document.getElementById('modalBody').innerHTML=`<div class="input-grid"><div class="field"><label>Готовность, %</label><input id="prReady" type="number" value="${p.ready}"></div><div class="field"><label>Факт часов</label><input id="prFact" type="number" value="${p.hoursFact}"></div></div><div class="input-grid"><div class="field"><label>Команда</label><input id="prTeam" type="number" value="${p.team}"></div><div class="field"><label>Дата завершения</label><input id="prFinish" value="${p.finish}"></div></div><button class="btn primary" onclick="saveProject()">Сохранить</button>`;openModal()}
function saveProject(){let p=current();p.ready=Math.max(0,Math.min(100,+document.getElementById('prReady').value||p.ready));p.hoursFact=+document.getElementById('prFact').value||p.hoursFact;p.team=+document.getElementById('prTeam').value||p.team;p.finish=document.getElementById('prFinish').value||p.finish;saveState();closeModal();renderProject();showToast('Проект обновлён')}
function openProject(id){state.currentProject=id;saveState();setView('project')}
function setView(name){
 document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
 ({home:renderHome,projects:renderProjects,sales:renderSales,finance:renderFinance,schedule:renderSchedule,load:renderLoad,project:renderProject}[name]||renderHome)();
 location.hash=name;
}
window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(h)setView(h)});
setView(location.hash.slice(1)||'sales');
</script>
</body>
